name: iOS native build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Build native app for simulator
        run: |
          set -o pipefail
          xcodebuild -project OpenDots.xcodeproj -scheme OpenDots -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build | tee build/build.log
      - name: Select an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run protocol and connection tests
        run: |
          set -o pipefail
          xcodebuild -project OpenDots.xcodeproj -scheme OpenDots -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO test | tee build/tests.log
      - name: Launch app and capture native screen
        run: |
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/OpenDots.app
          xcrun simctl launch "$DEVICE_ID" app.opendots.personal
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot build/ios-preview.png
          ditto -c -k --sequesterRsrc --keepParent build/DerivedData/Build/Products/Debug-iphonesimulator/OpenDots.app build/OpenDots-Simulator.zip
      - name: Build device app without signing
        run: |
          set -o pipefail
          xcodebuild -project OpenDots.xcodeproj -scheme OpenDots -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO build | tee build/device-build.log
      - name: Upload simulator app and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenDots-iOS-build
          path: |
            build/OpenDots-Simulator.zip
            build/ios-preview.png
            build/*.log
            build/Tests.xcresult
          retention-days: 14
